<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1B2B45">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>le bistrot de diane — Menu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-weight:300;min-height:100vh;overflow-x:hidden}
/* ── SUB-SECTIONS ── */
.sub-section{padding:0 0 4px}
.sub-section-deep{padding-left:16px}
/* Wrapper des frères — indentation, pas de bordure globale */
.sub-children{margin-left:14px;padding:0}
/* Chaque bloc titre+items a SA propre bordure gauche — s'arrête avant les sous-cats */
.sub-header{border-left:1.5px solid var(--br);padding-left:12px;padding-bottom:4px;margin-bottom:4px}
.sub-title-1{font-family:var(--fd);font-size:1.05em;font-weight:600;color:var(--ac);padding:10px 16px 10px;margin:22px 0 8px;display:flex;align-items:center;gap:12px}
.sub-title-1::before,.sub-title-1::after{content:'';flex:1;height:1px;background:var(--br);opacity:.7}
.sub-title-2{font-family:var(--fd);font-size:.88em;font-weight:600;color:var(--ac);padding:8px 0 4px 2px;margin:14px 0 6px;font-style:italic;display:block;border-left:2px solid var(--ac);padding-left:10px}
.sub-title-3{font-family:var(--fd);font-size:.82em;font-weight:500;color:var(--ac);padding:5px 0 3px 8px;margin:8px 0 4px;font-style:italic;display:block;opacity:.75;border-left:1px solid var(--ac);padding-left:8px}

/* ── LANG BAR ── */
#mini-header{position:sticky;top:0;z-index:101;background:var(--bg);border-bottom:1px solid var(--br);
  padding:9px 16px;text-align:center}
#mini-header-name{font-family:var(--fd);font-size:.95em;font-weight:600;letter-spacing:.5px;color:var(--hd)}
/* Un seul conteneur sticky regroupe tout le haut (langue, en-tête,
   filtres, onglets) — ils s'empilent en flux normal À L'INTÉRIEUR de ce
   bloc, qui colle en bloc en haut de l'écran. Ça évite tout calcul de
   décalage entre plusieurs éléments sticky indépendants (source de
   vides/chevauchements) : un seul top:0, point. */
#sticky-top{position:sticky;top:0;z-index:100;background:var(--bg);
  transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;backface-visibility:hidden}
#lang-bar{position:relative;background:var(--hd);display:flex;justify-content:flex-end;align-items:center;padding:8px 16px;gap:8px 4px}
#lang-btns{display:flex;align-items:center;gap:4px}
/* ── WI-FI PARTAGÉ ──
   Intégré directement dans #lang-bar (même bandeau que les boutons de
   langue) plutôt qu'en ligne séparée : wifi à gauche (margin-right:auto),
   langues à droite — un seul bandeau, moins encombrant, et hérite des
   compensations de marge/overflow déjà en place pour #lang-bar sur les
   thèmes comme L'Instant (pas besoin de les dupliquer).
   La carte dépliée est en position:absolute, ancrée à #lang-bar (pas à
   la pastille elle-même) : elle flotte au-dessus du contenu sans jamais
   agrandir la barre ni pousser FR/EN/NL — reste toujours à gauche, sans
   déborder sur les langues, quelle que soit sa largeur. */
#wifi-badge{display:inline-flex;margin-right:auto}
/* Replié par défaut : puce discrète en forme de pilule, peu de place
   prise. Dépliée : carte avec icône/titre/fermer, réseau, séparateur,
   mot de passe + bouton copier. Bascule au clic (jamais automatique au
   chargement), avec un vrai bouton fermer en plus du scroll/copie. */
#wifi-toggle-btn{display:none;align-items:center;gap:5px;border:1px solid currentColor;background:none;
  color:var(--bg);font-family:var(--fb);font-size:.62em;font-weight:600;letter-spacing:.2px;
  cursor:pointer;padding:5px 10px;border-radius:16px;
  animation:wifiPing 3.4s ease-in-out infinite;transition:background .15s}
/* Scintillement très lent et discret sur toute la pastille (icône + texte
   + contour ensemble) : signale "cliquable" sans être une animation
   voyante. Survol : on fige l'anim et on repasse à pleine opacité. */
#wifi-toggle-btn:hover{animation-play-state:paused;opacity:1;background:rgba(128,128,128,.08)}
@keyframes wifiPing{0%,100%{opacity:.5}50%{opacity:1}}
#wifi-expanded{position:absolute;top:calc(100% + 8px);left:16px;z-index:20;
  display:none;flex-direction:column;padding:9px 10px 10px;gap:7px;
  min-width:150px;max-width:min(65vw,220px);
  background:var(--bg2);border:1px solid var(--br);border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.22)}
#wifi-badge.wifi-collapsed #wifi-toggle-btn{display:inline-flex}
#wifi-badge.wifi-collapsed #wifi-expanded{display:none}
#wifi-badge:not(.wifi-collapsed) #wifi-toggle-btn{display:none}
#wifi-badge:not(.wifi-collapsed) #wifi-expanded{display:flex}
#wifi-expanded-head{display:flex;align-items:center;gap:5px;color:var(--hd);margin-bottom:0}
#wifi-expanded-head span{flex:1;font-family:var(--fb);font-size:.6em;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
#wifi-close-btn{flex-shrink:0;width:16px;height:16px;border:none;background:none;color:var(--t2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  border-radius:4px;transition:background .15s,color .15s}
#wifi-close-btn:hover{background:rgba(128,128,128,.12);color:var(--hd)}
.wifi-field{display:flex;flex-direction:column;gap:1px}
.wifi-label{font-family:var(--fb);font-size:.54em;color:var(--t2);text-transform:uppercase;
  letter-spacing:.4px}
.wifi-value{font-family:var(--fd);font-weight:700;color:var(--hd);font-size:.82em;
  word-break:break-all;line-height:1.25}
#wifi-divider{height:1px;background:var(--br);margin:0}
#wifi-pass-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#wifi-copy-btn{flex-shrink:0;display:flex;align-items:center;gap:4px;border:none;border-radius:7px;
  background:var(--ac);color:#fff;cursor:pointer;padding:4px 8px;font-family:var(--fb);
  font-size:.6em;font-weight:600;transition:transform .12s,opacity .12s}
#wifi-copy-btn:hover{opacity:.92}
#wifi-copy-btn:active{transform:scale(.94)}
#wifi-copied-toast{position:absolute;top:calc(100% + 6px);right:0;display:flex;align-items:center;gap:4px;
  background:#1a1a1a;color:#fff;font-size:.6em;font-weight:600;font-family:var(--fb);
  padding:5px 9px;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.22);
  opacity:0;transform:translateY(-4px);z-index:5;
  transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#wifi-copied-toast svg{color:#4ADE80;flex-shrink:0}
#wifi-copied-toast.show{opacity:1;transform:translateY(0)}
.lang-btn{color:var(--bg);opacity:.6;font-size:.75em;font-weight:500;letter-spacing:1px;padding:4px 10px;border-radius:20px;border:none;background:none;cursor:pointer;transition:all .2s}
.lang-btn.active{opacity:1;box-shadow:inset 0 0 0 1px currentColor}
.lang-btn:hover{opacity:1}

/* ── HEADER ──
   Statique — pas de compression au scroll (essayé, source de bugs de
   rendu récurrents sur sticky, abandonné). L'en-tête reste toujours à
   sa taille normale, fixe en haut avec le reste de #sticky-top. */
header{text-align:center;padding:36px 20px 28px;background:var(--bg);position:relative}
.orn{color:var(--ac);letter-spacing:8px;font-size:.85em;display:block;margin-bottom:12px}
h1{font-family:var(--fd);font-size:clamp(1.6em,6vw,2.6em);font-weight:700;color:var(--hd);letter-spacing:3px;
  text-transform:uppercase;line-height:1.2}
.tagline{font-family:var(--fd);font-style:italic;color:var(--ac);font-size:.9em;margin-top:8px;letter-spacing:1px}
.header-logo{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 16px;position:relative;box-shadow:0 6px 22px rgba(0,0,0,.25);background:var(--bg)}
.header-logo img{width:100%;height:100%;object-fit:contain;display:block}
.header-logo::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.18) 100%);pointer-events:none}
.schedule-badge{display:inline-block;margin-top:12px;padding:4px 14px;border-radius:20px;font-size:.72em;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.schedule-badge.midi{background:#FEF3E2;color:#B45309;border:1px solid #F59E0B}
.schedule-badge.soir{background:#EDE9FE;color:#5B21B6;border:1px solid #8B5CF6}

/* ── HAPPY HOUR ── */
.hh-banner{position:relative;overflow:hidden;margin:0 16px 14px;padding:16px 22px;
  border:1.5px solid var(--ac);border-radius:12px;background:var(--bg2);
  color:var(--text);text-align:center;line-height:1.5}
.hh-banner::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(128,128,128,.38) 50%,transparent 60%);
  mix-blend-mode:overlay;
  animation:hhshine 4s ease-in-out infinite}
@keyframes hhshine{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

/* ── FILTER BAR ── */
#filter-bar{padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--br);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#filter-bar::-webkit-scrollbar{display:none}
.filter-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--br);background:var(--bg);color:var(--t2);font-size:.78em;font-weight:500;cursor:pointer;transition:all .2s;margin-right:6px;white-space:nowrap}
.filter-chip.active{background:var(--hd);border-color:var(--hd);color:#fff}
.filter-chip .chip-icon{font-size:1em}
#filter-clear{display:inline-flex;align-items:center;padding:6px 10px;border-radius:20px;border:1.5px solid #ECC;background:#FFF5F5;color:var(--red);font-size:.75em;font-weight:500;cursor:pointer;transition:all .2s;display:none}

/* ── TAB NAV ── */
#tab-nav-wrap{position:relative;background:var(--bg)}
#tab-nav{background:var(--bg);border-bottom:2px solid var(--br);overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex}
#tab-nav::-webkit-scrollbar{display:none}
#cat-banner{width:100%;line-height:0;background:var(--bg2)}
#cat-banner img{width:100%;max-height:220px;object-fit:cover;object-position:center;display:block}
.tab-btn{flex-shrink:0;padding:12px 20px;border:none;background:none;color:var(--t2);font-family:var(--fd);font-size:.88em;font-weight:600;letter-spacing:.5px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap}
.tab-btn.active{color:var(--hd);border-bottom-color:var(--ac)}

/* ── SECTIONS ── */
.cat-section{display:none;padding:0 0 32px}
.cat-section.active{display:block}
.sec-title{font-family:var(--fd);font-size:1.3em;font-weight:600;color:var(--hd);padding:20px 16px 10px;letter-spacing:1px;text-align:center}
.empty-msg{text-align:center;color:var(--ft);font-style:italic;padding:32px 16px;font-size:.9em}

/* ── AFFICHAGE EN GRILLE (option par catégorie) ── */
.cat-section.active.cat-grid,.sub-section.cat-grid,.cat-grid .sub-header{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.cat-section.active.cat-grid>*,.sub-section.cat-grid>*,.cat-grid .sub-header>*{grid-column:1/-1}
.cat-section.active.cat-grid>.dish-card,.sub-section.cat-grid>.dish-card,.cat-grid .sub-header>.dish-card{grid-column:auto}
.cat-grid .dish-card{flex-direction:column;align-items:stretch;gap:0;padding:0;border:1px solid var(--br);border-radius:12px;overflow:hidden;background:var(--bg2)}
.cat-grid .dish-photo-wrap{width:100%;height:auto;aspect-ratio:1/1;border-radius:0;box-shadow:none}
.cat-grid .dish-photo-wrap::after{border-radius:0}
.cat-grid .dish-main{padding:10px 12px 12px}
.cat-grid .dish-name-row{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;row-gap:2px}
.cat-grid .dish-name{flex:1 1 100%;margin-bottom:0}
.cat-grid .dt{display:none}
.cat-grid .dish-arrow{display:none}
.cat-grid .dish-price{margin-top:1px}
.cat-grid .dish-desc{margin:6px 0 0}
.cat-grid .empty-msg{grid-column:1/-1}

/* ── DISH CARD ── */
.dish-card{display:flex;gap:12px;padding:14px 16px;background:var(--bg);cursor:pointer;transition:background .15s;align-items:flex-start}
.dish-card:hover,.dish-card:active{background:var(--bg2)}
.dish-card.no-detail{cursor:default}
.dish-card.no-detail:hover,.dish-card.no-detail:active{background:var(--bg)}
.dish-card.hidden{display:none!important}
.dish-card.dimmed{opacity:.35}
.dish-photo-wrap{width:84px;height:84px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.dish-photo-wrap::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.20) 100%);pointer-events:none}
.dish-photo{width:100%;height:100%;object-fit:cover;display:block}
.dish-main{flex:1;min-width:0}
.dish-name{font-family:var(--fd);font-size:1em;color:var(--hd);font-weight:600;line-height:1.3;margin-bottom:3px}
.dish-desc{font-size:.8em;color:var(--ft);font-style:italic;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badge{font-size:.68em;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.badge.allergen{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.badge.diet{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0}
.dish-right{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:4px}
.dish-price{font-family:var(--fd);font-weight:700;color:var(--hd);font-size:1em;white-space:nowrap}
.dish-inclus{font-style:italic;font-weight:400;color:var(--ft);font-size:.85em}
.variants-table{display:table;border-collapse:separate;border-spacing:0 1px;margin-top:1px}
.variant-row{display:table-row}
.var-label{display:table-cell;color:var(--t2);font-size:.78em;padding:1px 10px 1px 0;white-space:nowrap;text-align:left;font-style:italic}
.var-price{display:table-cell;font-family:var(--fd);font-weight:700;color:var(--hd);font-size:.88em;text-align:right;white-space:nowrap}
/* ── TABLE VARIANTES ALIGNÉES (carte des vins) ── */
.vt-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.vt-header{display:flex;align-items:flex-end;padding:8px 16px 6px;border-bottom:2px solid var(--ac)}
.vt-hname{flex:1;min-width:90px;display:flex;align-items:baseline;gap:6px;overflow:hidden}
.vt-hname-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--fd);color:var(--hd);font-weight:600;font-size:.95em;flex:0 1 auto;min-width:0}
.vt-hname-dt{flex:1;border-bottom:1px dotted var(--ac);opacity:.5;align-self:flex-end;margin-bottom:3px;min-width:8px;flex-shrink:0}
.vt-hcol{width:72px;flex-shrink:0;text-align:right;font-size:.78em;color:var(--ac);font-style:italic;font-weight:700;padding-right:2px;white-space:nowrap}
.vt-row{display:flex;align-items:baseline;padding:9px 16px;cursor:default;transition:background .15s}
.vt-row.vt-click{cursor:pointer}
.vt-row:hover{background:var(--bg2)}
.vt-row .vt-hcol{width:72px;flex-shrink:0;text-align:right;font-family:var(--fd);font-weight:700;color:var(--hd);font-size:.9em;padding-right:2px;white-space:nowrap}
.vt-empty{color:var(--t2);opacity:.35;font-weight:400;text-align:center}
.vt-row .vt-empty{text-align:center}
/* Responsive vins/multi-format ≤ 600px : les colonnes de prix ne tiennent pas sur
   mobile → on empile. Nom (+ bouton +) sur une ligne pleine largeur, puis les prix
   en pastilles libellées qui s'enroulent dessous. Plus de chevauchement ni de noms
   écrasés sur 4 lignes. */
@media(max-width:600px){
  .vt-header{display:none}
  .vt-row{flex-wrap:wrap;align-items:center;padding:11px 12px;row-gap:6px}
  .vt-row .vt-hname{flex:1 1 100%;min-width:0;overflow:visible;align-items:center}
  .vt-hname-txt{white-space:normal;word-break:break-word;text-overflow:clip;overflow:visible;font-size:.95em;line-height:1.25;flex:0 1 auto}
  .vt-hname-dt{flex:1 1 12px;min-width:12px;margin-bottom:0;align-self:center}
  .vt-row .vt-hcol{width:auto;flex:0 0 auto;text-align:left;white-space:nowrap;
    padding:3px 10px;margin:0 6px 0 0;font-size:.82em;line-height:1.25;
    background:var(--bg2);border:1px solid var(--ac);border-radius:999px}
  .vt-row .vt-hcol::before{content:attr(data-l) "\A0";color:var(--ac);font-style:italic;font-weight:700;font-size:.85em;opacity:.9}
  .vt-row .vt-hcol.vt-empty{display:none}
}
.dish-name-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dish-weight{font-size:.78em;color:var(--t2);font-weight:500;white-space:nowrap}
.dt{flex:1;border-bottom:1px dotted var(--ac);opacity:.4;min-width:14px;align-self:flex-end;margin-bottom:3px}
.dish-arrow{color:var(--ac);font-size:1.1em;opacity:.6}

/* ── FORMULA CARD ── */
.formula-card{padding:14px 16px;border:1px solid var(--ac);border-left:3px solid var(--ac);background:var(--bg2);cursor:pointer;transition:opacity .15s;border-radius:3px;margin:8px 16px}
.formula-card:hover{opacity:.85}
.formula-card.hidden{display:none!important}
.formula-card.dimmed{opacity:.35}
.formula-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.formula-name{font-family:var(--fd);font-size:1em;font-weight:600;color:var(--hd)}
.formula-price{font-family:var(--fd);font-weight:700;color:var(--ac);font-size:1em;white-space:nowrap}
.formula-type{font-size:.78em;color:var(--ac);font-style:italic;margin-bottom:3px}
.formula-desc{font-size:.8em;color:var(--ft);font-style:italic;margin-bottom:8px}
/* ── CARTE FORMULE (.fc) ── */
.fc{background:var(--bg2);border:1px solid var(--br);border-left:3px solid var(--ac);padding:16px 20px;margin:10px 0;border-radius:3px}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.fc .fn{font-family:var(--fd);font-size:.97em;font-weight:600;color:var(--hd)}
.fc .fp{font-weight:700;color:var(--ac);white-space:nowrap;font-size:.93em}
.fd{font-style:italic;color:var(--t2);font-size:.84em;margin-top:5px}
.fco{font-style:italic;color:var(--t2);font-size:.81em;margin-top:6px}
.fc.hidden{display:none!important}
.fc.dimmed{opacity:.35}
.formula-sections{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.formula-sec{background:var(--bg);border-radius:3px;padding:8px 12px;border-left:2px solid var(--ac)}
.formula-sec-hd{font-family:var(--fd);font-size:.75em;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.formula-row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;border-bottom:1px dotted var(--br)}
.formula-row:last-child{border-bottom:none}
.formula-choice{font-size:.88em;color:var(--text);flex:1}
.formula-supp{font-size:.82em;font-weight:700;color:var(--ac);white-space:nowrap;margin-left:8px}
.formula-supp-inc{color:var(--ft);font-weight:400;font-style:italic}
/* ── ONGLET PLAT DU JOUR ── */
.daily-tab-banner{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 16px 10px;margin-bottom:4px}
.daily-tab-label{font-family:var(--fd);font-size:1em;font-style:italic;color:var(--ac);letter-spacing:2px}
.daily-tab-icon{color:var(--ac);font-size:.8em;opacity:.6}
/* ── PLAT DU JOUR ── */
.daily-card{background:var(--bg2);border:1px solid var(--ac);border-top:3px solid var(--ac);padding:16px 18px;margin:10px 16px;border-radius:4px;cursor:pointer;transition:opacity .15s,box-shadow .15s;position:relative;overflow:hidden}
.daily-card:hover{box-shadow:0 3px 14px rgba(0,0,0,.12);opacity:.92}
.daily-card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(128,128,128,.38) 50%,transparent 60%);
  mix-blend-mode:overlay;animation:hhshine 4s ease-in-out infinite}
.daily-card.hidden{display:none!important}
.daily-card.dimmed{opacity:.35}
.daily-badge{font-size:.72em;color:var(--ac);font-style:italic;font-family:var(--fd);letter-spacing:1.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.daily-badge::after{content:'';flex:1;height:1px;background:var(--ac);opacity:.3}
.daily-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.daily-name{font-family:var(--fd);font-size:1.05em;font-weight:700;color:var(--hd)}
.daily-price{font-family:var(--fd);font-weight:700;color:var(--ac);font-size:1.05em;white-space:nowrap}
.daily-desc{font-size:.82em;color:var(--ft);font-style:italic;margin-top:6px;line-height:1.5}

/* ── MENU ENFANT ── */
.child-card{background:var(--bg2);border:1px solid var(--br);border-left:4px solid var(--ac);padding:12px 16px;margin:6px 16px;border-radius:6px;cursor:pointer;transition:background .15s}
.child-card:hover{background:var(--bg)}
.child-card.hidden{display:none!important}
.child-card.dimmed{opacity:.35}
.child-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.child-name{font-family:var(--fb);font-size:.97em;font-weight:600;color:var(--hd)}
.child-price{font-family:var(--fb);font-weight:700;color:var(--ac);font-size:.97em;white-space:nowrap}
.child-desc{font-size:.8em;color:var(--ft);margin-top:4px}
.child-badge{font-size:.68em;color:var(--ac);font-style:italic;margin-bottom:6px;opacity:.8}
/* ── SUGGESTION COMPOSÉE ── */
.comp-card{background:var(--bg2);border:1px solid var(--ac);border-top:3px solid var(--ac);padding:10px 20px 12px;margin:8px 16px;border-radius:4px}
.comp-card.hidden{display:none!important}.comp-card.dimmed{opacity:.35}
.comp-title{font-family:var(--fd);font-size:.82em;font-style:italic;color:var(--ac);letter-spacing:1.5px;text-align:center;margin-bottom:6px;opacity:.85}
.comp-cascade{display:flex;flex-direction:column;align-items:center;gap:0}
.comp-line{font-family:var(--fd);font-size:1.02em;font-weight:600;color:var(--hd);text-align:center;line-height:1.35;padding:1px 0}
.comp-plus{color:var(--ac);font-size:.85em;font-weight:700;line-height:1;opacity:.65;padding:1px 0}
.comp-inline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;font-family:var(--fd);font-size:1.02em;font-weight:600;color:var(--hd)}
.comp-sep{color:var(--ac);margin:0 5px;font-weight:700;opacity:.65}
.comp-footer{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:7px;border-top:1px solid rgba(0,0,0,.07);gap:8px}
.comp-desc{font-size:.8em;color:var(--ft);font-style:italic}
.comp-price{font-family:var(--fd);font-weight:700;color:var(--ac);font-size:1.05em;white-space:nowrap;margin-left:auto}
/* ── TEXTE LIBRE ── */
.text-block{padding:10px 16px 4px;margin:0 0 2px}
.text-block p{font-size:.92em;color:var(--text);line-height:1.7;margin:0 0 10px;padding:0}
.text-block em{font-style:italic}.text-block strong{font-weight:700}.text-block u{text-decoration:underline}
/* ── DETAIL MODAL ── */
#detail-modal{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:24px 16px}
#detail-modal.open{display:flex}
#modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.78);animation:fadeIn .2s}
#modal-box{position:relative;background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:18px;max-height:85vh;overflow-y:auto;animation:modalPop .22s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#modal-box.modal-soldout #modal-name,#modal-box.modal-soldout #modal-price{opacity:.5}
@keyframes modalPop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
.dc-soldout-badge{display:inline-block;margin-left:10px;padding:2px 8px;border:2px solid #D62828;border-radius:5px;color:#D62828;font-weight:800;font-size:.5em;letter-spacing:1.5px;text-transform:uppercase;transform:rotate(-7deg);vertical-align:middle;line-height:1.15;background:rgba(214,40,40,.07);white-space:nowrap}
#modal-photo-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:18px 18px 0 0;display:none}
#modal-photo-wrap.visible{display:block}
#modal-photo{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#modal-photo-fade{position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
.modal-body{padding:20px 20px 24px}
.modal-handle{display:none}
#modal-close{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.9);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1em;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:2}
#modal-name{font-family:var(--fd);font-size:1.3em;font-weight:700;color:var(--hd);margin-bottom:6px}
#modal-price{font-family:var(--fd);font-size:1.1em;font-weight:700;color:var(--ac);margin-bottom:10px}
#modal-desc{font-size:.88em;color:var(--t2);font-style:italic;line-height:1.6;margin-bottom:14px}
#modal-details{font-size:.83em;color:var(--t2);line-height:1.6;margin-bottom:14px;padding:12px;background:var(--bg2);border-radius:8px;border-left:3px solid var(--ac)}
#modal-allergens-title{font-size:.78em;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
#modal-badges{display:flex;flex-wrap:wrap;gap:5px}

/* admin panel supprimé — accessible via admin.html séparé */

/* ── LIEN SITE OFFICIEL (header) ── */
.header-website{display:inline-block;margin-top:10px;color:var(--ac);font-size:.78em;letter-spacing:.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ac);opacity:.8;transition:opacity .2s}
.header-website:hover{opacity:1}
/* ── RÉSEAUX SOCIAUX (header) ── */
.header-social-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:20px}
.header-social{display:inline-flex;align-items:center;gap:6px;color:var(--ac);font-size:.78em;letter-spacing:.3px;text-decoration:none;opacity:.85;transition:opacity .2s}
.header-social:hover{opacity:1}
/* ── BOUTON AVIS GOOGLE (footer) ── */
.review-btn{display:inline-flex;align-items:center;gap:8px;margin:14px auto 4px;padding:11px 24px;background:var(--ac);color:#fff;border-radius:24px;font-size:.82em;font-weight:600;letter-spacing:.4px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:opacity .2s,transform .15s}
.review-btn:hover{opacity:.88;transform:translateY(-1px)}
.review-stars{font-size:1.1em;letter-spacing:1px;color:#FFD700}
/* ── FOOTER ── */
footer{text-align:center;padding:28px 16px;border-top:1px solid var(--br);color:var(--ft);font-size:.72em;letter-spacing:1px;margin-top:8px}
footer .copy{margin-top:6px;opacity:.6;font-size:.9em;line-height:1.6}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── RESPONSIVE MOBILE ─────────────────────────────────── */
/* Téléphones ≤ 480px (portrait) */
@media(max-width:480px){
  /* Header */
  header{padding:24px 14px 18px}
  h1{letter-spacing:2px;font-size:clamp(1.3em,7vw,2em)}
  .header-logo{width:100px;height:100px}
  /* Tabs */
  .tab-btn{padding:10px 13px;font-size:.82em;letter-spacing:0}
  /* Sections */
  .sec-title{font-size:1.15em;padding:16px 12px 8px}
  .sub-title-1{font-size:.95em;padding:8px 12px;margin:16px 0 6px}
  /* Dish card : photo plus petite + prix autorisé à passer à la ligne */
  .dish-card{padding:12px 12px;gap:10px}
  .dish-photo-wrap{width:68px;height:68px;flex-shrink:0}
  .dish-name-row{flex-wrap:wrap;gap:4px;align-items:center}
  .dt{align-self:center;margin-bottom:0;flex:1 0 20px;min-width:20px}
  /* Si le bouton + passe à la ligne (nom long), on le garde aligné à droite
     comme toutes les autres lignes, jamais seul à gauche. */
  .dish-name-row .dc-add{margin-left:auto}
  .dish-name{font-size:.95em}
  .dish-right{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;gap:4px 8px;align-items:center}
  .dish-price{font-size:.95em}
  .dish-desc{font-size:.78em;margin-bottom:4px}
  .badge{font-size:.65em}
  /* Formula card */
  .formula-card{margin:6px 10px;padding:12px 14px}
  .formula-top{flex-wrap:wrap;gap:4px}
  .formula-name{font-size:.95em}
  .formula-price{font-size:.95em}
  .fc{padding:14px 14px;margin:8px 0}
  .fh{flex-wrap:wrap;gap:4px}
  /* Daily card */
  .daily-card{margin:8px 10px;padding:12px 14px}
  .daily-top{flex-wrap:wrap;gap:4px}
  .daily-name{font-size:.97em}
  .daily-price{font-size:.97em}
  /* Child card */
  .child-card{margin:4px 10px;padding:10px 14px}
  .child-top{flex-wrap:wrap;gap:4px}
  /* Text block */
  .text-block{padding:8px 12px 4px}
  .text-block p{font-size:.88em}
  /* Modal */
  #modal-name{font-size:1.15em}
}

/* Très petits téléphones ≤ 360px */
@media(max-width:360px){
  header{padding:18px 10px 14px}
  h1{letter-spacing:1px}
  .dish-card{padding:10px 10px;gap:8px}
  .dish-photo-wrap{width:56px;height:56px}
  .dish-name{font-size:.88em}
  .dish-price{font-size:.88em}
  .tab-btn{padding:8px 10px;font-size:.76em}
  .formula-card{margin:4px 8px;padding:10px 12px}
  .child-card{margin:4px 8px;padding:8px 12px}
  .daily-card{margin:6px 8px;padding:10px 12px}
  .sub-title-1{font-size:.88em;padding:6px 10px}
  .sec-title{font-size:1.05em}
  .text-block p{font-size:.84em}
}

/* Tablette ≥ 600px : un peu plus de confort */
@media(min-width:600px){
  .dish-card{padding:16px 20px;gap:16px}
  .dish-photo-wrap{width:92px;height:92px}
  .dish-name{font-size:1.05em}
  .formula-card{margin:8px 20px}
  .daily-card{margin:10px 20px}
  .child-card{margin:6px 20px}
  header{padding:44px 24px 34px}
}

function topLevelCats() { return MENU.filter(c => !c.parent_id); }

// ── SCHEDULE ────────────────────────────────────────────────────────
const MIDI_SLOTS = [{"days": [], "start": 690, "end": 900}];
const SOIR_SLOTS = [{"days": [], "start": 1080, "end": 1380}];
/* Une plage {days,start,end} matche si le jour ISO courant est dans days
   ([]=tous) et si l'heure courante tombe dans [start,end) — gère aussi une
   fenêtre passant minuit (end <= start). Plusieurs plages indépendantes par
   service (jours/horaires différents selon les plages), la première qui
   matche suffit. */
function _slotMatches(slot, iso, t) {
  const okDay = !slot.days.length || slot.days.indexOf(iso) >= 0;
  if (!okDay) return false;
  if (slot.end <= slot.start) return t >= slot.start || t < slot.end;
  return t >= slot.start && t < slot.end;
}
function getService() {
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes();
  const wd = d.getDay(); // 0=Dim,1=Lun…6=Sam (JS)
  const iso = wd === 0 ? 6 : wd - 1; // 0=Lun…6=Dim (ISO)
  if (MIDI_SLOTS.some(s => _slotMatches(s, iso, t))) return 'midi';
  if (SOIR_SLOTS.some(s => _slotMatches(s, iso, t))) return 'soir';
  return 'all';
}

// ── HAPPY HOUR ──────────────────────────────────────────────────────
const HAPPY_HOUR_ENABLED = false;
const HAPPY_HOUR_SLOTS = [{"days": [0, 1, 2, 3, 4, 5, 6], "start": 1020, "end": 1140}];

  if (!HAPPY_HOUR_ENABLED || !HAPPY_HOUR_SLOTS.length) return false;
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes();
  const wd = d.getDay(), iso = wd === 0 ? 6 : wd - 1;
  return HAPPY_HOUR_SLOTS.some(s => _slotMatches(s, iso, t));
}
function refreshHappyHour() {
  const el = document.getElementById('dc-happyhour');
  if (!el) return;
  el.style.display = isHappyHourActive() ? '' : 'none';
}

/* Nettoie les artefacts MyMemory : "€ 17 Voorgerecht..." → "Voorgerecht..." */
function cleanTr(t) {
  if (!t) return t;
  t = t.replace(/^[€$£¥]\s*\d[\d.,]*\s+/, '').trim(); /* préfixe prix parasite */
  t = t.replace(/:+\s*$/, '').trim();                      /* deux-points final    */
  return t;
}

function trItem(item, field) {
  if (lang === 'fr') return item[field] || '';
  const raw = (item.translations && item.translations[lang] && item.translations[lang][field]) || '';
  const cleaned = raw ? cleanTr(raw) : '';
  return cleaned || item[field] || '';
}
function trFormula(type) {
  if (lang === 'fr') return FORMULA_FR[type] || '';
  return (FORMULA_L[lang] && FORMULA_L[lang][type]) || FORMULA_FR[type] || '';

function trBadge(kind, code) {

    if (lang === 'fr') return frLabel;

  const frLabel = DIET_L[code] || code;
  if (lang === 'fr') return frLabel;
  return (G[lang] && G[lang][frLabel]) || frLabel;
}

    ...(SHOW_DIET_TAGS  ? [
      {id:'vegetarien',   emoji:'🌿', key:'Végétarien',   type:'diet'},
      {id:'vegan',        emoji:'🌱', key:'Vegan',         type:'diet'},
      {id:'sans_gluten',  emoji:'🌾', key:'Sans gluten',   type:'diet'},
      {id:'sans_lactose', emoji:'🥛', key:'Sans lactose',  type:'diet'},
    ] : []),
    ...(SHOW_ALLERGENS ? [
      {id:'no_arachides', emoji:'🥜', key:'Sans arachides', type:'allergen'},
    ] : []),
  ];
  bar.innerHTML = chips.map(c =>
    `<button class="filter-chip${filters.has(c.id)?' active':''}" data-filter="${c.id}"
      onclick="toggleFilter('${c.id}','${c.type}')">  ${c.emoji} ${tr(c.key)}</button>`
  ).join('') +
  `<button id="filter-clear" onclick="clearFilters()"
    style="display:${filters.size>0?'inline-flex':'none'}">✕ ${tr('Effacer')}</button>`;
}

function buildTabs() {
  const nav = document.getElementById('tab-nav');
  const svc = getService();
  const roots = topLevelCats().filter(c => shouldShowCat(c, svc));
  nav.innerHTML = roots.map((c,i) =>
    `<button class="tab-btn${i===0?' active':''}" data-cat="${c.id}" onclick="switchTab('${c.id}')">${trCat(c)}</button>`
  ).join('');
  if (roots.length) { activeTab = roots[0].id; updateCatBanner(activeTab); }
}

/* La photo de catégorie défile normalement avec le contenu (aucune
   animation de hauteur en JS — source de saccades/recalculs de mise en
   page pendant le scroll). */
function updateCatBanner(catId) {
  const banner = document.getElementById('cat-banner');
  const img = document.getElementById('cat-banner-img');
  const cat = MENU.find(c => c.id === catId);
  if (cat && cat.photo) {
    img.src = cat.photo;
    img.alt = trCat(cat);
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }
}

function trCat(cat) {
  if (lang === 'fr') return cat.name;
  return (cat.trans && cat.trans[lang]) || tr(cat.name) || cat.name;
}

function shouldShowCat(cat, svc) {
  const cs = cat.schedule || 'all';
  if (cs === 'custom') {
    const slots = cat.custom_slots || [];
    if (!slots.length) return true;
    const d = new Date(), t = d.getHours() * 60 + d.getMinutes();
    const wd = d.getDay();
    const iso = wd === 0 ? 6 : wd - 1;
    return slots.some(s => _slotMatches(s, iso, t));
  }
  return cs === 'all' || cs === svc;
}

function buildSections() {
  const content = document.getElementById('menu-content');
  const svc = getService();
  const roots = topLevelCats().filter(c => shouldShowCat(c, svc));
  content.innerHTML = roots.map((cat, ci) => {
    return `<section class="cat-section${ci===0?' active':''}${cat.grid_layout?' cat-grid':''}" id="sec-${cat.id}">
      ${renderCatContent(cat,svc,0)}
      <div class="empty-msg" id="empty-${cat.id}" style="display:none">${tr('Aucun plat disponible avec ces filtres.')}</div>
    </section>`;
  }).join('');
}

function renderSubSection(cat, svc, depth) {
  const titleCls = depth===1 ? 'sub-title-1' : depth===2 ? 'sub-title-2' : 'sub-title-3';
  const secCls   = (depth>=2  ? 'sub-section sub-section-deep' : 'sub-section') + (cat.grid_layout ? ' cat-grid' : '');
  if (depth >= 2) {
    return `<div class="${secCls}" id="subsec-${cat.id}">
      <div class="sub-header">
        <div class="${titleCls}" id="sectitle-${cat.id}">${trCat(cat)}</div>
        ${renderCatContent(cat,svc,depth)}
      </div>
    </div>`;
  }
  return `<div class="${secCls}" id="subsec-${cat.id}">
    <div class="${titleCls}" id="sectitle-${cat.id}">${trCat(cat)}</div>
    ${renderCatContent(cat,svc,depth)}
  </div>`;
}

/* Rend le contenu d'une catégorie en respectant children_order :
   items et sous-catégories entremêlés dans le bon ordre. */
function renderCatContent(cat, svc, depth) {
  const order = cat.children_order;
  const itemsById = {};
  (cat.items || []).forEach(i => { itemsById[i.id] = i; });
  const catsById = {};
  getChildren(cat.id).forEach(c => { catsById[c.id] = c; });

  if (!order || !order.length) {
    /* Fallback : items d'abord, puis sous-cats */
    const ih = renderCatItems(cat, svc);
    const ch = getChildren(cat.id)
      .filter(c => shouldShowCat(c, svc))
      .map(c => renderSubSection(c, svc, depth + 1)).join('');
    return ih + ch;
  }

  /* Rendu dans l'ordre de children_order */
  /* Les items avec variantes doivent être regroupés en tableau ;
     on repère les blocs consécutifs d'items-variantes. */
  let html = '';
  let varBlock = [];   /* tampon pour items avec variantes consécutifs */

  function flushVarBlock() {
    if (!varBlock.length) return;
    html += renderVariantTable(varBlock);
    varBlock = [];
  }

  for (const entry of order) {
    const etype = entry[0], eid = entry[1];
    if (etype === 'item') {
      const item = itemsById[eid];
      if (!item) continue;
      const sched = item.schedule || 'all';
      if (sched !== 'all' && sched !== svc) continue;
      if (item.variants && item.variants.length > 0) {
        varBlock.push(item);   /* accumuler pour le tableau groupé */
      } else {
        flushVarBlock();
        if (cat.type === 'daily' && html === '' && !item.is_text) {
          html += `<div class="daily-tab-banner"><span class="daily-tab-icon">✦</span><span class="daily-tab-label">Suggestions du jour</span><span class="daily-tab-icon">✦</span></div>`;
        }
        html += item.is_formula  ? renderFormula(item)
              : item.is_daily    ? renderDaily(item)
              : item.is_children ? renderChild(item)
              : item.is_text     ? renderTextPara(item)
              : renderDish(item);
      }
    } else if (etype === 'cat') {
      flushVarBlock();
      const subcat = catsById[eid];
      if (!subcat || !shouldShowCat(subcat, svc)) continue;
      html += renderSubSection(subcat, svc, depth + 1);
    }
  }
  flushVarBlock();
  return html;
}

function renderVariantTable(items) {
  /* Même logique que renderCatItems pour le tableau aligné */
  const labels = [];
  items.forEach(item => {
    (item.variants||[]).forEach(v => {
      if (!labels.includes(v.label)) labels.push(v.label);
    });
  });
  let html = '<div class="vt-wrap">';
  html += '<div class="vt-header"><div class="vt-hname"></div>';
  labels.forEach(l => { html += `<div class="vt-hcol">${escHtml(l)}</div>`; });
  html += '</div>';
  items.forEach(item => {
    const al = (item.allergens||[]).join(' ');
    const dt = (item.diet_tags||[]).join(' ');
    const name = trItem(item,'name');
    const hasDetail = !!(item.comment&&item.comment.trim())
                    || !!(item.details&&item.details.trim())
                    || !!(item.photo&&item.photo.length>10)
                    || (SHOW_ALLERGENS&&item.allergens&&item.allergens.length>0)
                    || (SHOW_DIET_TAGS &&item.diet_tags &&item.diet_tags.length>0);
    const click = hasDetail ? `onclick="openModal('${item.id}');trackClick('${item.id}')"` : '';
    const arrow = hasDetail ? `<span class="dish-arrow" style="font-size:.85em;margin-left:4px">›</span>` : '';
    html += `<div class="vt-row${hasDetail?' vt-click':''}" data-id="${item.id}" data-allergens="${al}" data-diet="${dt}" ${click}>`;
    html += `<div class="vt-hname"><span class="vt-hname-txt">${escHtml(name)}${arrow}</span><div class="vt-hname-dt"></div></div>`;
    labels.forEach(l => {
      const v = (item.variants||[]).find(vv => vv.label === l);
      html += v
        ? `<div class="vt-hcol" data-l="${escHtml(l)}">${parseFloat(v.price).toFixed(2).replace('.',',')}&nbsp;€</div>`
        : `<div class="vt-hcol vt-empty" data-l="${escHtml(l)}">—</div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderCatItems(cat, svc) {
  if (!cat.items||!cat.items.length) return '';

  // Filtrer selon le service actuel
  const visible = cat.items.filter(item => {
    const sched = item.schedule||'all';
    return sched==='all'||sched===svc;
  });
  if (!visible.length) return '';

  // Banner spécial pour les onglets "Plat du jour"
  let html = '';
  if (cat.type === 'daily') {
    html += `<div class="daily-tab-banner"><span class="daily-tab-icon">✦</span><span class="daily-tab-label">Suggestions du jour</span><span class="daily-tab-icon">✦</span></div>`;
  }

  // Séparer articles avec variantes / sans variantes
  const withVar = visible.filter(i => i.variants && i.variants.length > 0);
  const withoutVar = visible.filter(i => !i.variants || i.variants.length === 0);

  // ── TABLE ALIGNÉE pour les articles avec variantes ────────────
  if (withVar.length > 0) {
    /* Merge topologique : respecte l'ordre relatif défini dans chaque item.
       Ex: item1=[12cl,50cl], item2=[25cl,50cl] → [12cl,25cl,50cl]
           item1=[150ml,75cl], item2=[75cl,1L]  → [150ml,75cl,1L]  */
    const labels = [];
    withVar.forEach(item => {
      const itemLabels = (item.variants||[]).map(v => v.label);
      itemLabels.forEach((label, i) => {
        if (labels.includes(label)) return;
        const nextKnown = itemLabels.slice(i + 1).find(l => labels.includes(l));
        if (nextKnown) {
          labels.splice(labels.indexOf(nextKnown), 0, label);
        } else {
          labels.push(label);
        }
      });
    });

    html += '<div class="vt-wrap">';

    // En-tête colonnes
    html += '<div class="vt-header"><div class="vt-hname"></div>';
    labels.forEach(l => { html += `<div class="vt-hcol">${escHtml(l)}</div>`; });
    html += '</div>';

    // Lignes
    visible.forEach(item => {
      if (!item.variants || item.variants.length === 0) return;
      const al  = (item.allergens||[]).join(' ');
      const dt  = (item.diet_tags||[]).join(' ');
      const name = trItem(item,'name');
      const hasDetail = !!(item.comment&&item.comment.trim())
                      || !!(item.details&&item.details.trim())
                      || !!(item.photo&&item.photo.length>10)
                      || (SHOW_ALLERGENS&&item.allergens&&item.allergens.length>0)
                      || (SHOW_DIET_TAGS &&item.diet_tags &&item.diet_tags.length>0);
      const click = hasDetail
        ? `onclick="openModal('${item.id}');trackClick('${item.id}')"` : '';
      const arrow = hasDetail ? `<span class="dish-arrow" style="font-size:.85em;margin-left:4px">›</span>` : '';

      html += `<div class="vt-row${hasDetail?' vt-click':''}" data-id="${item.id}" data-allergens="${al}" data-diet="${dt}" ${click}>`;
      // Colonne nom avec pointillés
      html += `<div class="vt-hname"><span class="vt-hname-txt">${escHtml(name)}${arrow}</span><div class="vt-hname-dt"></div></div>`;
      // Colonnes prix alignées
      labels.forEach(l => {
        const v = (item.variants||[]).find(vv => vv.label === l);
        html += v
          ? `<div class="vt-hcol" data-l="${escHtml(l)}">${parseFloat(v.price).toFixed(2).replace('.',',')}&nbsp;€</div>`
          : `<div class="vt-hcol vt-empty" data-l="${escHtml(l)}">—</div>`;
      });
      html += '</div>';
    });

    html += '</div>';
  }

  // ── Rendu normal pour les articles sans variantes ─────────────
  withoutVar.forEach(item => {
    html += item.is_composed ? renderComposed(item)
          : item.is_formula  ? renderFormula(item)
          : item.is_daily    ? renderDaily(item)
          : item.is_children ? renderChild(item)
          : item.is_text     ? renderTextPara(item)
          : renderDish(item);
  });

  return html;
}


function renderDish(item) {
  const al = (item.allergens || []).join(' ');
  const dt = (item.diet_tags || []).join(' ');
  const hasPic = item.photo && item.photo.length > 10;
  const hasDetail = hasPic
    || !!(item.comment && item.comment.trim())
    || (SHOW_ALLERGENS && item.allergens && item.allergens.length > 0)
    || (SHOW_DIET_TAGS  && item.diet_tags  && item.diet_tags.length  > 0);
  const pic = hasPic ? `<div class="dish-photo-wrap"><img class="dish-photo" src="${item.photo}" alt="" loading="lazy"></div>` : '';
  const name = trItem(item,'name');
  const desc = trItem(item,'comment');
  const badges = [
    ...(SHOW_ALLERGENS ? (item.allergens||[]).map(a=>`<span class="badge allergen" data-code="al:${a}">${trBadge('al',a)}</span>`) : []),
    ...(SHOW_DIET_TAGS  ? (item.diet_tags||[]).map(d=>`<span class="badge diet" data-code="dt:${d}">${trBadge('dt',d)}</span>`)    : []),
  ].join('');
  const clickAttr = hasDetail ? `onclick="openModal('${item.id}');trackClick('${item.id}')"` : '';
  const arrow = hasDetail ? `<span class="dish-arrow">›</span>` : '';
  return `<div class="dish-card${hasDetail?'':' no-detail'}" data-id="${item.id}" data-allergens="${al}" data-diet="${dt}" ${clickAttr}>
    ${pic}
    <div class="dish-main">
      <div class="dish-name-row">
        <span class="dish-name">${escHtml(name)}</span>
        ${item.weight!=null?`<span class="dish-weight">${fmtWeight(item)}</span>`:''}
        <div class="dt"></div>
        ${!(item.variants&&item.variants.length)
           ? (item.inclus
              ? `<span class="dish-price dish-inclus">inclus</span>`
              : `<span class="dish-price">${item.price.toFixed(2).replace('.',',')} €</span>`)
           : ''}
        ${arrow}
      </div>
      ${desc?`<div class="dish-desc">${escHtml(desc).replace(/\n/g,'<br>')}</div>`:''}
      ${badges?`<div class="badge-row">${badges}</div>`:''}
    </div>
    ${(item.variants&&item.variants.length)?`<div class="dish-right variants-table">${item.variants.map(v=>`<div class="variant-row"><span class="var-label">${escHtml(v.label)}</span><span class="var-price">${parseFloat(v.price).toFixed(2).replace('.',',')} €</span></div>`).join('')}</div>`:''}</div>`;
}

function fmtWeight(item) {
  if (item.weight == null) return '';
  const v = item.weight.toString().replace('.', ',');
  return v + ' ' + (item.weight_unit || 'g');
}

function fmtFormulaTypes(item) {
  const t = item.formula_type;
  if (!t || (Array.isArray(t) && t.length === 0)) return '';
  const arr = Array.isArray(t) ? t : [t];
  return arr.map(code => trFormula(code)).filter(Boolean).join(' ou ');
}

function renderChild(item) {
  const name = trItem(item,'name');
  const desc = trItem(item,'comment');
  const hasDetail = !!(item.comment && item.comment.trim())
    || (item.photo && item.photo.length > 10)
    || (SHOW_ALLERGENS && item.allergens && item.allergens.length > 0);
  const clickAttr = hasDetail ? `onclick="openModal('${item.id}');trackClick('${item.id}')"` : '';
  return `<div class="child-card" data-id="${item.id}" data-allergens="${(item.allergens||[]).join(' ')}" data-diet="${(item.diet_tags||[]).join(' ')}" ${clickAttr}>
    <div class="child-badge">🧒 Menu Enfant</div>
    <div class="child-top">
      <span class="child-name">${escHtml(name)}</span>
      <span class="child-price">${item.price.toFixed(2).replace('.',',')} €</span>
    </div>
    ${desc ? `<div class="child-desc">${escHtml(desc).replace(/\n/g,'<br>')}</div>` : ''}
  </div>`;
}

function renderTextPara(item) {
  const fmt = item.text_format || {};
  const spans = item.text_spans;
  let content = '';
  const trTxt = (lang !== 'fr' && item.translations && item.translations[lang] && item.translations[lang].text) ? item.translations[lang].text : '';
  if (trTxt) {
    /* Appliquer le style ligne par ligne : chaque ligne traduite hérite du style
       des spans de la ligne correspondante dans l'original */
    const trLines = trTxt.split('\n');
    if (spans && spans.length > 0) {
      /* Regrouper les spans par ligne */
      const lineGroups = [[]];
      for (const sp of spans) {
        const parts = sp.t.split('\n');
        parts.forEach((part, idx) => {
          if (idx > 0) lineGroups.push([]);
          lineGroups[lineGroups.length - 1].push({t: part, b: sp.b, i: sp.i, u: sp.u, c: sp.c});
        });
      }
      content = trLines.map((line, i) => {
        const grp = lineGroups[i] || lineGroups[lineGroups.length - 1];
        const bold   = grp.some(sp => sp.b);
        const italic = grp.some(sp => sp.i);
        const under  = grp.some(sp => sp.u);
        const colors = [...new Set(grp.filter(sp => sp.c).map(sp => sp.c))];
        const col    = colors.length === 1 ? colors[0] : '';
        let out = escHtml(line);
        if (bold && italic) out = `<strong><em>${out}</em></strong>`;
        else if (bold)      out = `<strong>${out}</strong>`;
        else if (italic)    out = `<em>${out}</em>`;
        if (under) out = `<u>${out}</u>`;
        if (col)   out = `<span style="color:${col}">${out}</span>`;
        return out;
      }).join('<br>');
    } else {
      content = trLines.map(l => escHtml(l)).join('<br>');
    }
  } else if (spans && spans.length > 0) {
    for (const sp of spans) {
      let t = escHtml(sp.t).replace(/\n/g, '<br>');
      if (sp.b && sp.i) t = `<strong><em>${t}</em></strong>`;
      else if (sp.b)    t = `<strong>${t}</strong>`;
      else if (sp.i)    t = `<em>${t}</em>`;
      if (sp.u) t = `<u>${t}</u>`;
      if (sp.c) t = `<span style="color:${sp.c}">${t}</span>`;
      content += t;
    }
  } else {
    content = escHtml(trItem(item,'name')).replace(/\n/g,'<br>');
  }
  if (!content.trim()) return '';
  let style = '';
  if (fmt.align && fmt.align !== 'left') style += `text-align:${fmt.align};`;
  const sizeMap = {title:'1.35em', large:'1.1em', normal:'0.95em', small:'0.82em'};
  style += `font-size:${sizeMap[fmt.size] || '0.95em'};`;
  const tag = (fmt.size === 'title') ? 'h3' : 'p';
  return `<div class="text-block" data-id="${item.id}" style="${style}"><${tag}>${content}</${tag}></div>`;
}

function renderDaily(item) {
  const name = trItem(item,'name');
  const desc = trItem(item,'comment');
  const hasDetail = !!(item.comment && item.comment.trim())
    || (item.photo && item.photo.length > 10)
    || (SHOW_ALLERGENS && item.allergens && item.allergens.length > 0)
    || (SHOW_DIET_TAGS  && item.diet_tags  && item.diet_tags.length  > 0);
  const clickAttr = hasDetail ? `onclick="openModal('${item.id}');trackClick('${item.id}')"` : '';
  return `<div class="daily-card" data-id="${item.id}" data-allergens="${(item.allergens||[]).join(' ')}" data-diet="${(item.diet_tags||[]).join(' ')}" ${clickAttr}>
    <div class="daily-badge">✦ Suggestion du jour</div>
    <div class="daily-top">
      <span class="daily-name">${escHtml(name)}</span>
      <span class="daily-price">${item.price.toFixed(2).replace('.',',')} €</span>
    </div>
    ${desc ? `<div class="daily-desc">${escHtml(desc).replace(/\n/g,'<br>')}</div>` : ''}
  </div>`;
}

function renderFormula(item) {
  const name = trItem(item,'name');
  const desc = trItem(item,'comment');
  const typeStr = fmtFormulaTypes(item);
  const secs = item.formula_sections || {};
  const secLabels = {'E':'Entrées','P':'Plats','D':'Desserts'};
  let sectionsHtml = '';
  ['E','P','D'].forEach(k => {
    const rows = secs[k];
    if (!rows || !rows.length) return;
    sectionsHtml += `<div class="formula-sec">`;
    sectionsHtml += `<div class="formula-sec-hd">${secLabels[k]}</div>`;
    rows.forEach(r => {
      const supp = r.supplement && r.supplement > 0
        ? `<span class="formula-supp">+${parseFloat(r.supplement).toFixed(2).replace('.',',')} €</span>`
        : `<span class="formula-supp formula-supp-inc">inclus</span>`;
      sectionsHtml += `<div class="formula-row"><span class="formula-choice">${escHtml(r.name)}</span>${supp}</div>`;
    });
    sectionsHtml += `</div>`;
  });
  const priceHtml = item.price > 0
    ? `<span class="fp">${item.price.toFixed(2).replace('.',',')} €</span>` : '';
  /* Afficher le nom en titre, typeStr en sous-titre si différents, sinon description */
  const showBoth = name && typeStr && name !== typeStr;
  const subLine = showBoth ? typeStr : (desc || '');
  return `<div class="fc" data-id="${item.id}" data-allergens="" data-diet="">
    <div class="fh">
      <span class="fn">${escHtml(showBoth ? name : (typeStr || name))}</span>
      ${priceHtml}
    </div>
    ${subLine ? `<div class="fd">${escHtml(subLine).replace(/\n/g,'<br>')}</div>` : ''}
    ${sectionsHtml ? `<div class="formula-sections">${sectionsHtml}</div>` : ''}
  </div>`;
}

function renderComposed(item) {
  const lines  = item.composed_lines || [];
  const inline = item.composed_style === 'inline';
  const name   = trItem(item, 'name');
  const desc   = trItem(item, 'comment');
  const priceHtml = item.price > 0
    ? `<span class="comp-price">${item.price.toFixed(2).replace('.',',')} €</span>` : '';
  let content = '';
  if (inline) {
    content = `<div class="comp-inline">${lines.map(l=>escHtml(l)).join('<span class="comp-sep">+</span>')}</div>`;
  } else {
    content = `<div class="comp-cascade">${lines.map((l,i)=>
      (i>0?'<div class="comp-plus">+</div>':'')+`<div class="comp-line">${escHtml(l)}</div>`
    ).join('')}</div>`;
  }
  return `<div class="comp-card" data-id="${item.id}" data-allergens="" data-diet="">
    ${name ? `<div class="comp-title">${escHtml(name)}</div>` : ''}
    ${content}
    <div class="comp-footer">
      ${desc ? `<div class="comp-desc">${escHtml(desc)}</div>` : ''}
      ${priceHtml}
    </div>
  </div>`;
}

// ── TABS ────────────────────────────────────────────────────────────
function switchTab(catId) {
  activeTab = catId;
  document.querySelectorAll('.cat-section').forEach(s=>s.classList.toggle('active', s.id==='sec-'+catId));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.cat===catId));
  updateCatBanner(catId);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── LANGUAGE ────────────────────────────────────────────────────────
function updateFooter() {
  const yr = new Date().getFullYear();
  const fd = document.getElementById('footer-date');
  const fc = document.getElementById('footer-copy');
  if (fd) fd.textContent = tr('Mis à jour le') + ' 7 août 2026 à 06h57';
  if (fc) fc.innerHTML =
    '© N.Y ' + yr + ' — DematCard. ' + tr('Tous droits réservés.') +
    '<br>' + tr('Toute reproduction ou diffusion interdite sans autorisation écrite.');
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.id==='btn-'+l));
  document.documentElement.lang = l;
  document.getElementById('tagline').textContent = tr('Menu du moment');
  refreshScheduleBadge();
  buildFilterBar();
  updateFooter();
  // Update all section titles (top-level and sub-sections)
  MENU.forEach(cat => {
    const el = document.getElementById('sectitle-' + cat.id);
    if (el) el.textContent = trCat(cat);
  });
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    const cat = MENU.find(c=>c.id===btn.dataset.cat);
    if (cat) btn.textContent = trCat(cat);
  });
  document.querySelectorAll('[id^=empty-]').forEach(em=>{
    em.textContent = tr('Aucun plat disponible avec ces filtres.');
  });
  /* ── Panier de commande ── */
  if(typeof window.dcUpdateLang === 'function') window.dcUpdateLang();
  /* ── Cartes plats normaux ── */
  document.querySelectorAll('.dish-card').forEach(card=>{
    const id = card.dataset.id;
    const item = findItem(id);
    if (!item) return;
    const nameEl = card.querySelector('.dish-name');
    const descEl = card.querySelector('.dish-desc');
    if (nameEl) nameEl.textContent = trItem(item,'name');
    if (descEl) descEl.textContent = trItem(item,'comment');
    card.querySelectorAll('[data-code]').forEach(badge=>{
      const [kind, code] = badge.dataset.code.split(':');
      badge.textContent = trBadge(kind, code);
    });
  });
  /* ── Cartes formule (.fc) ── */
  document.querySelectorAll('.fc[data-id]').forEach(card=>{
    const id = card.dataset.id;
    const item = findItem(id);
    if (!item) return;
    const nameEl = card.querySelector('.fn');
    const descEl = card.querySelector('.fd');
    if (nameEl) nameEl.textContent = trItem(item,'name');
    if (descEl) {
      const typeStr = fmtFormulaTypes(item);
      const name    = trItem(item,'name');
      const subLine = (typeStr && typeStr !== name) ? typeStr : (trItem(item,'comment') || '');
      descEl.textContent = subLine;
    }
  });
  /* ── Cartes menu enfants (.child-card) ── */
  document.querySelectorAll('.child-card[data-id]').forEach(card=>{
    const id = card.dataset.id;
    const item = findItem(id);
    if (!item) return;
    const nameEl = card.querySelector('.child-name');
    const descEl = card.querySelector('.child-desc');
    if (nameEl) nameEl.textContent = trItem(item,'name');
    if (descEl) descEl.textContent = trItem(item,'comment');
  });
  /* ── Cartes suggestion du jour (.daily-card) ── */
  document.querySelectorAll('.daily-card[data-id]').forEach(card=>{
    const id = card.dataset.id;
    const item = findItem(id);
    if (!item) return;
    const nameEl = card.querySelector('.daily-name');
    const descEl = card.querySelector('.daily-desc');
    if (nameEl) nameEl.textContent = trItem(item,'name');
    if (descEl) descEl.textContent = trItem(item,'comment');
  });
  /* ── Lignes variantes (.vt-row) — apéritifs / boissons ── */
  document.querySelectorAll('.vt-row[data-id]').forEach(row=>{
    const id = row.dataset.id;
    const item = findItem(id);
    if (!item) return;
    const nameEl = row.querySelector('.vt-hname-txt');
    if (nameEl) {
      /* Conserver la flèche › si présente */
      const arrow = nameEl.querySelector('.dish-arrow');
      nameEl.textContent = trItem(item,'name');
      if (arrow) nameEl.appendChild(arrow);
    }
  });
  /* ── Blocs texte libre (.text-block) ── */
  Array.from(document.querySelectorAll('.text-block[data-id]')).forEach(block=>{
    const item = findItem(block.dataset.id);
    if (!item) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = renderTextPara(item);
    const nb = tmp.firstElementChild;
    if (nb) block.replaceWith(nb);
  });
}

function findItem(id) {
  for (const cat of MENU) for (const it of (cat.items||[])) if (it.id===id) return it;
  return null;
}

// ── FILTERS ─────────────────────────────────────────────────────────
function toggleFilter(filterId, type) {
  const btn = document.querySelector(`[data-filter="${filterId}"]`);
  if (filters.has(filterId)) { filters.delete(filterId); btn&&btn.classList.remove('active'); }
  else { filters.add(filterId); btn&&btn.classList.add('active'); }
  applyFilters();
  document.getElementById('filter-clear').style.display = filters.size>0?'inline-flex':'none';
}
function clearFilters() {
  filters.clear();
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('filter-clear').style.display='none';
  applyFilters();
}
function applyFilters() {
  document.querySelectorAll('.dish-card,.formula-card').forEach(card=>{
    let show = true;
    for (const f of filters) {
      if (f.startsWith('no_')) {
        const al = f.slice(3);
        if ((card.dataset.allergens||'').split(' ').includes(al)) show=false;
      } else {
        if (!(card.dataset.diet||'').split(' ').includes(f)) show=false;
      }
    }
    card.classList.toggle('hidden', !show);
  });
  document.querySelectorAll('.cat-section').forEach(sec=>{
    const cid = sec.id.replace('sec-','');
    const visible = [...sec.querySelectorAll('.dish-card,.formula-card')].some(c=>!c.classList.contains('hidden'));
    const em = document.getElementById('empty-'+cid);
    if (em) em.style.display = visible?'none':'block';
  });
}

// ── MODAL ───────────────────────────────────────────────────────────
function openModal(id) {
  const item = findItem(id);
  if (!item) return;
  const name = trItem(item,'name');
  const desc = trItem(item,'comment');
  const det  = item.details || '';
  const modal = document.getElementById('detail-modal');
  const photoWrap = document.getElementById('modal-photo-wrap');
  const photo = document.getElementById('modal-photo');
  if (item.photo && item.photo.length>10) {
    photo.src = item.photo; photoWrap.classList.add('visible');
  } else {
    photo.src=''; photoWrap.classList.remove('visible');
  }
  const _nameEl = document.getElementById('modal-name');
  _nameEl.textContent = name;
  document.getElementById('modal-price').textContent = item.price.toFixed(2)+' €';
  /* Tampon « Épuisé » + grisé si l'article est marqué indisponible (classe posée
     sur la carte par le panier). */
  const _box = document.getElementById('modal-box');
  const _sold = !!document.querySelector('.dc-soldout[data-id="'+id+'"]');
  if (_sold) {
    _box.classList.add('modal-soldout');
    const _b = document.createElement('span');
    _b.className = 'dc-soldout-badge'; _b.textContent = tr('Épuisé');
    _nameEl.appendChild(_b);
  } else {
    _box.classList.remove('modal-soldout');
  }
  document.getElementById('modal-desc').textContent  = desc;
  const detEl = document.getElementById('modal-details');
  detEl.textContent = det; detEl.style.display = det?'block':'none';
  const alTitle = document.getElementById('modal-allergens-title');
  const alBadges= document.getElementById('modal-badges');
  const allBadges = [
    ...(SHOW_ALLERGENS ? (item.allergens||[]).map(a=>`<span class="badge allergen">${trBadge('al',a)}</span>`) : []),
    ...(SHOW_DIET_TAGS  ? (item.diet_tags||[]).map(d=>`<span class="badge diet">${trBadge('dt',d)}</span>`)    : []),
  ];
  if (allBadges.length) {
    alTitle.textContent=tr('Allergènes'); alTitle.style.display='block';
    alBadges.innerHTML=allBadges.join('');
  } else {
    alTitle.style.display='none'; alBadges.innerHTML='';
  }
  modal.classList.add('open');
  document.body.style.overflow='hidden';
  /* Escamote la cloche d'appel serveur pendant la lecture du détail
     (sinon elle recouvre le texte) — elle revient à la fermeture. */
  document.body.classList.add('dc-reading');
}
function closeModal() {
  document.getElementById('detail-modal').classList.remove('open');
  document.body.style.overflow='';
  document.body.classList.remove('dc-reading');
}

// ── ANALYTICS ───────────────────────────────────────────────────────
function trackScan() {
  try {
    const today = new Date().toISOString().slice(0,10);
    const d = JSON.parse(localStorage.getItem('dc_scans')||'{}');
    d[today] = (d[today]||0)+1;
    localStorage.setItem('dc_scans',JSON.stringify(d));
  } catch(e) {}
}
function trackClick(id) {
  try {
    const d = JSON.parse(localStorage.getItem('dc_clicks')||'{}');
    d[id] = (d[id]||0)+1;
    localStorage.setItem('dc_clicks',JSON.stringify(d));
  } catch(e) {}
}

// ── UTILITIES ───────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── WI-FI PARTAGÉ ──────────────────────────────────────────────────
const WIFI_ENABLED  = true;
const WIFI_SSID     = "test";
const WIFI_PASSWORD = "test";
function initWifiBadge() {
  if (!WIFI_ENABLED) return;
  document.getElementById('wifi-ssid-text').textContent = WIFI_SSID;
  document.getElementById('wifi-pass-text').textContent = WIFI_PASSWORD || '—';
  document.getElementById('wifi-badge').style.display = '';
  updateBarVisibility();
}
function toggleWifiBadge() {
  document.getElementById('wifi-badge').classList.toggle('wifi-collapsed');
}
function copyWifiPassword() {
  const txt = WIFI_PASSWORD || '';
  if (!txt) return;
  const showToast = () => {
    const toast = document.getElementById('wifi-copied-toast');
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => {
      toast.classList.remove('show');
      /* Redevient discret une fois le mot de passe copié — plus besoin
         de le garder ouvert. */
      const badge = document.getElementById('wifi-badge');
      if (badge) badge.classList.add('wifi-collapsed');
    }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(showToast).catch(() => _fallbackCopy(txt, showToast));
  } else {
    _fallbackCopy(txt, showToast);
  }
}
function _fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  done();
}
/* Repli automatique dès qu'on commence à scroller — pas de suivi continu
   ni de recalcul de mise en page (leçon tirée des soucis précédents
   avec l'en-tête) : juste une bascule de classe, une fois, sans effet
   de bord sur le reste de la page (élément hors de #sticky-top). */
function _onScrollWifiBadge() {
  if (window.scrollY > 24) {
    const badge = document.getElementById('wifi-badge');
    if (badge) badge.classList.add('wifi-collapsed');
  }
}
window.addEventListener('scroll', _onScrollWifiBadge, {passive: true});

(function init() {
  buildLangBar();
  refreshScheduleBadge();
  refreshHappyHour();
  setInterval(refreshHappyHour, 60000);
  buildFilterBar();
  buildTabs();
  buildSections();
  updateFooter();
  trackScan();
  initWifiBadge();
  // Swipe to close modal
  let touchY=0;
  document.getElementById('modal-box').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});
  document.getElementById('modal-box').addEventListener('touchmove',e=>{
    if(e.touches[0].clientY-touchY>60) closeModal();
  },{passive:true});
})();
</script>
